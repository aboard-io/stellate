# verify.yml — the PR gate: the full ./verify.sh suite in a clean clone with
# ZERO fetched media. tools/ci-standin-media.js synthesizes quiet-noise
# stand-ins at every path the gates check (~4s, ~86MB, no network); the signal in the
# engine smoke test comes from the committed Faust wasm in engine/faust/dist/.
#
# What this proves: pipeline structure and non-silence — matrix diagonal
# dominance (178/178), kernel determinism/vocabulary gates, real Faust presses.
# What it can't prove: how the found layer sounds. Local ./verify.sh over real
# fetched media stays the pre-ship gate (machines verify structure, human ears
# verify taste).
#
# The verifier-catalog submodule is intentionally NOT checked out — it's
# optional (reference data + MCP tool only; nothing the gates run imports it).
#
# Caveat: a PR adding a new dx7_algN algorithm would trigger press.js's
# on-demand Faust compile and fail loudly here — such PRs must commit the
# compiled module in engine/faust/dist/ (see CONTRIBUTING.md).
name: verify

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # recipes, not media: no audio/video/SoundFont/model binary may be
      # tracked (verify.sh runs the same guard; duplicated here so the failure
      # is legible as its own step). engine/faust/dist/*.wasm is allowed —
      # compiled from committed dsp/ sources; found/ catalogs are JSON.
      - name: media guard — no tracked audio/video/model binaries
        run: |
          TRACKED_MEDIA=$(git ls-files | grep -iE '\.(wav|mp3|mp4|ogg|oga|flac|m4a|aac|aif|aiff|webm|mov|avi|mkv|sf2|sf3|pb|syx|onnx|tflite)$' || true)
          if [ -n "$TRACKED_MEDIA" ]; then
            echo "::error::media files are tracked in git (the one rule: source committed, audio derived):"
            printf '%s\n' "$TRACKED_MEDIA"
            exit 1
          fi
          echo "clean — no tracked media"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # preinstalled on ubuntu runner images; install only if ever absent
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: npm ci (faustwasm)
        working-directory: engine/faust
        run: npm ci

      - name: stand-in media (~4s, ~86MB, no network)
        run: node tools/ci-standin-media.js

      - name: verify.sh — matrix + validate + engine smoke
        run: ./verify.sh

      - name: theory + pipes gates
        run: |
          node test/theory.test.js
          node test/pipes.test.js
