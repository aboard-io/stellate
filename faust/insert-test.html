<!doctype html>
<!-- faust/insert-test.html — live harness for per-voice INSERT chains
     (state.instruments.<voice>.inserts). Driven by insert-test-run.js:
     loads a test state (?state=/scratch/... or a JSON you paste), goes live,
     then glideParams() / swapTypes() mutate the insert specs mid-run —
     the engine must glide params and crossfade chain rebuilds without clicks.
     Click detector: polls the master analyser (2048 samples every 25ms —
     overlapping windows, full coverage) and logs max per-sample delta. -->
<html>
<head><meta charset="utf-8"><title>FaustLive insert test</title></head>
<body style="background:#111;color:#9fe;font:14px monospace;padding:1em">
<button id="go">Go live</button>
<button id="glide">Glide insert params</button>
<button id="swap">Swap insert types</button>
<button id="stop">Stop</button>
<pre id="log"></pre>
<script src="../csd-engine.js"></script>
<script src="state-engine.js"></script>
<script src="found-player.js"></script>
<script src="sampler.js"></script>
<script src="live.js"></script>
<script>
  const logEl = document.getElementById("log");
  const log = (m) => { logEl.textContent += m + "\n"; };
  let handle = null, state = null;
  window.TEST = { bars: [], loads: [], rms: [], deltas: [], errors: [], status: [], marks: {} };

  window.goLive = async function (stateUrl) {
    state = await (await fetch(stateUrl)).json();
    handle = await FaustLive.exploreLive(
      () => state,
      (m) => { TEST.status.push(m); log("status: " + m); },
      { onBar: (b) => { TEST.bars.push(b); log(`bar ${b.serial} ${b.section} ${b.chord}`); },
        onLoad: (r, e) => { TEST.loads.push({ t: performance.now() / 1000, r, e }); } });
    window.handle = handle;
    window._rmsTimer = setInterval(() => { if (handle) TEST.rms.push(handle.rms()); }, 500);
    // click scan: max per-sample delta in each (overlapping) analyser window
    const buf = new Float32Array(handle.analyser.fftSize);
    window._clickTimer = setInterval(() => {
      if (!handle) return;
      handle.analyser.getFloatTimeDomainData(buf);
      let md = 0;
      for (let i = 1; i < buf.length; i++) { const d = Math.abs(buf[i] - buf[i - 1]); if (d > md) md = d; }
      TEST.deltas.push({ t: performance.now() / 1000, d: md });
    }, 25);
    return true;
  };
  // mid-run param glide: same types, new params (engine must setTargetAtTime)
  window.glideParams = function () {
    const I = state.instruments;
    if (I.pad.inserts[0]) Object.assign(I.pad.inserts[0], { rate: 1.6, depth: 0.9, mix: 0.85 });
    if (I.bass.inserts[0]) Object.assign(I.bass.inserts[0], { drive: 0.85, mix: 0.95 });
    if (I.melody.inserts[0]) Object.assign(I.melody.inserts[0], { rateBars: 0.5, res: 0.7 });
    TEST.marks.glide = performance.now() / 1000;
    log("GLIDE at " + TEST.marks.glide.toFixed(1));
    return true;
  };
  // mid-run type swap: chain rebuild (engine must crossfade old/new chains)
  window.swapTypes = function () {
    state.instruments.pad.inserts = [{ type: "chorus", rate: 0.9, depth: 0.7, mix: 0.6 }];
    state.instruments.bass.inserts = [{ type: "filtersweep", rateBars: 1, lo: -1, hi: 1, res: 0.5 }];
    TEST.marks.swap = performance.now() / 1000;
    log("SWAP at " + TEST.marks.swap.toFixed(1));
    return true;
  };
  window.stopLive = function () {
    clearInterval(window._rmsTimer); clearInterval(window._clickTimer);
    if (handle) { TEST.errors.push(...handle.errors); handle.stop(); handle = null; }
    return TEST;
  };
  document.getElementById("go").onclick = () => goLive("/scratch/st-combo-ins.json");
  document.getElementById("glide").onclick = () => glideParams();
  document.getElementById("swap").onclick = () => swapTypes();
  document.getElementById("stop").onclick = () => stopLive();
</script>
</body>
</html>
