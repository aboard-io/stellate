<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The band — say it</title>
<meta name="description" content="A band: an arranger, a drummer, a bass player, a keys player and an engineer. The arranger calls the tune; everyone else decides what is theirs.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="nukernel/hw.css">
<link rel="stylesheet" href="nukernel/drums.css">
<link rel="stylesheet" href="nukernel/band.css">
</head>
<body>

<!-- ONE PURPOSE, ONE PAGE. No rail, no pages, no grid — the whole interface
     is the words that are worth saying right now (drums-kit.js decides), the
     last few things said, and one key that starts and stops it. -->
<main class="dpage">
  <header class="dbar">
    <h1 class="dmast">The band</h1>
    <button class="dreset" id="ddice" type="button" aria-label="a record from a dice roll"
            title="a record from a dice roll">⚄</button>
    <button class="dreset" id="dreset" type="button" aria-label="start again"
            title="start again">⟲</button>
    <button class="dplay" id="dplay" type="button" aria-label="play"></button>
  </header>
  <div class="dwrap" id="dwrap"></div>
</main>

<script src="engine/registry-data.js"></script>
<script src="engine/faust/voices/sampler.js"></script>
<!-- No speech.js here: nukernel does not sing (a fresh espeak heap per
     utterance took Safari out of memory). test/unit/nukernel.test.js §74
     holds it out; the parent's organ is untouched. -->
<script src="engine/faust/voices/found-player.js"></script>
<script src="nukernel/kernel.js"></script>
<script src="nukernel/genres.js"></script>
<script src="nukernel/fields.js"></script>
<script src="nukernel/song.js"></script>
<script src="nukernel/instruments.js"></script>
<script src="nukernel/compose.js"></script>
<script src="nukernel/presets.js"></script>
<script src="nukernel/drums-kit.js"></script>
<script src="nukernel/bass-kit.js"></script>
<script src="nukernel/keys-kit.js"></script>
<script src="nukernel/ideas-kit.js"></script>
<script src="nukernel/guitar-kit.js"></script>
<script src="nukernel/vocal-kit.js"></script>
<script src="nukernel/askable.js"></script>
<script src="nukernel/band-kit.js"></script>
<script type="module" src="nukernel/ui/band.js"></script>
</body>
</html>
