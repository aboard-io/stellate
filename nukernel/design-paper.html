<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design system, paper skin — Stellate</title>


<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="nu.css">
<link rel="stylesheet" href="skins/paper.css">
<link rel="icon" href="data:,">

<body class="dg-body">

<main id="gal" aria-label="Design system"></main>

<script type="module" src="ui/copy.js"></script>
<script type="module" src="ui/ui.js"></script>
<script type="module">
  /* THE WHOLE OF THIS PAGE'S OWN CODE. `ui/ui.js` registers the elements when
     it is evaluated and publishes its surface on `globalThis.NuUI`; this waits
     for that and hands it the host. Module scripts are deferred and run in
     order, so `NuUI` is up by the time this line does — the poll is for the
     one case that is not ordered, a gate that injects this file. */
  const go = () => {
    const ui = globalThis.NuUI;
    if (!ui) { requestAnimationFrame(go); return; }
    ui.gallery(document.getElementById("gal"));
  };
  go();
</script>
</body>
</html>
