<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>nukernel</title>
<meta name="description" content="A synth duo in London in 1985, and a control for every one of the eight axes the record is made of.">
<meta name="robots" content="noindex">
<!-- ONE STYLESHEET, AND ONLY ONE (Paul, 2026-08-24: "keep the raw plain HTML
     but use more controls and a little bit of CSS. use more grid lines in
     tables, it will help"). This supersedes 2026-08-23's "use simple HTML with
     no CSS or styling", which was the right instruction for a page that had
     never been read on a phone: measured at 375px on 2026-08-24 the document
     scrolled 15px sideways, every button was 21px tall, every checkbox 13px,
     and there were 96 radios on the default record. The stylesheet is nu.css
     and it says four things and no fifth — tap targets, two sticky bands,
     per-table scroll panes, grid lines. The HTML did not get less plain: it is
     still headings, paragraphs, tables, labels, fieldsets, radios, checkboxes,
     ranges, outputs and buttons, generated from the document
     (nukernel/songs.js) by ui/eight.js, and every option still comes from a
     table, so the page can only put the record into states the tables already
     name. (This said "selects, checkboxes, numbers, one button and one slider",
     and it has been rewritten twice in one day rather than corrected, because
     both rewrites were right. On the MORNING of 2026-08-24 there was not one
     <select> left on the page at all — the sixteen in #app became sheets, the
     twenty-three on the board became ranges and sheets, and the atlas's three
     navigation menus were deleted outright, Paul: "the options for each
     instrument in a song section are now just one thing in a dropdown. That's
     not effective. sheets of organized options should light up" and "get rid of
     the era select boxes, the look at select box, the 'nearby' select box, the
     genre list, etc." That EVENING some of them came back, by name: "We can
     return some things to select menus: meter / reading speed / swing / key /
     mode / the changes / chord quality can be selects inside the 'the changes'
     table … in the band 'form' section -- return to dropdowns/select … in
     voices -- plays, material, instrument -- dropdowns/selects … in general
     where there is ONE option a dropdown is preferred." Neither sentence is a
     correction of the other and the page now holds both: a lit sheet is for the
     per-voice, per-section DEVELOPMENT WORDS, where you compare twenty-one
     musical options at once and a greyed one has to say why; a menu is for a
     SETTLED PARAMETER — the meter, the key, what a player plays — one value,
     decided once. ui/selects.js's header carries both sentences side by side
     and is the one place the rule is written down.) With the stylesheet
     disabled the page still reads top to bottom as the same document.
     IN <head>, BEFORE THE SCRIPTS, and not only for the flash: abcjs appends
     two <style> elements of its own at runtime, so a <link> parsed here is
     what makes nu.css document.styleSheets[0] — the handle the sheets gate
     and Paul's stylesheet-off check both use. -->
<link rel="stylesheet" href="nu.css">
<!-- AND NO REQUEST FOR A FAVICON. An empty data: URI, which is the only way to
     tell a browser not to go and ask: every load of this page fetched
     /favicon.ico and took a 404 for it, which is a network round trip on a page
     whose whole claim is that it plays and draws with the wire cut. It is also
     the last line of test/sheets.js's "zero console errors" — a check that has
     to stay literal to be worth anything, so the noise goes rather than the
     check. -->
<link rel="icon" href="data:,">
</head>
<body>

<h1 id="title"></h1>

<!-- ONE .nu-bar PER PAGE, and it is this one. It is sticky at top:0 and
     exactly --bar-h tall, because .nu-ax > h2 sits at top: var(--bar-h) and a
     third control in here that WRAPPED would open a gap under every axis
     heading. test/shell.js pins the number for that reason. -->
<div class="nu-bar">
  <button id="play" type="button">play</button>
  <!-- "room", NOT "volume", 2026-08-27 — FUTURE.md §5: the master strip
       already teaches "the room, not the record", and this slider is the same
       store (ui/state.js VOLSTORE) wearing the same fact. -->
  <label for="vol">room <input type="range" id="vol" min="0" max="100" step="1" value="100"></label>
</div>
<!-- WHICH ENGINE THE EAR GOT, AND WHETHER IT STARVED. It lives OUTSIDE #app on
     purpose: draw() empties #app on every edit, and a readout that is destroyed
     and rebuilt once a keystroke is a readout with no memory. The sentence is
     written by audio/live.js engineLine(), not here — the wording is a claim
     about the engine and it has one owner. Blank until the engine answers.
     UNDER the bar and not IN it (integrator, 08-shell R2 x 01-crackle §1): the
     bar is a promise about a height, and this sentence grows to two lines on a
     host that sends no COOP/COEP. -->
<p id="engine"></p>

<!-- A GLOBE YOU TURN AND A SLIDER FOR WHEN (Paul, 2026-08-24: "a slider for
     time and a world map on top that shows where the genres are happening! I
     scroll to a time, click a place, and now i've got a song", then "make the
     map 3d and zoomable like google earth but keep it black and white").

     IT WAS <details>, AND THE COMMENT THAT STOOD HERE PREDICTED THIS. It said:
     "<details> because a map plus a 116-row list above a 2264px document is a
     wall on a phone, and <summary> is the browser's own disclosure — no JS, no
     CSS, no ARIA. Open by default, so nothing is hidden from a first look
     (band.css:1, 'Nothing can be hidden anywhere'); IF THAT READS AS HIDING
     ANYWAY THE FIX IS ONE LINE, <section> INSTEAD OF <details>."

     It read as hiding. Paul, 2026-08-24: "Don't make 'Details' collapsible."
     And the word he quoted is the second half of the story: the page rendered
     the browser's own DEFAULT LABEL, "Details", instead of the summary text —
     because ui/atlas.js's mount() opened with `parent.textContent = ""`, which
     deleted the <summary> this file shipped, and a <details> with no <summary>
     has no label of its own. Nothing was styling it wrong; the view was eating
     its own heading. <section> takes the cause away, and mount() no longer
     destroys markup it did not create.

     The 116-row list the disclosure was hiding is gone too, in the same
     sentence: "get rid of the era select boxes, the look at select box, the
     'nearby' select box, the genre list, etc." What is left is two controls —
     a globe and a full-width when-slider — and neither is a wall.

     THE <h2> SHIPS HERE, not in the view, so the heading survives with the
     stylesheet off and so the view has something it must NOT delete. Under it,
     ui/atlas.js appends the sentence, the when-slider, the globe and one
     button, in that order — DOM order is reading order is tab order, and the
     slider comes before the places it scopes.

     Still ABOVE #app and still OUTSIDE it, for the reason #engine is outside
     it: draw() empties #app on every edit, and a globe that was destroyed and
     rebuilt once a keystroke would lose its pose and its year. -->
<section id="atlas">
  <!-- "Where & when" since 2026-08-27 (FUTURE.md §5: "keep the name, fix the
     case") — test/atlas.js G7 reads this heading off the rendered page. -->
<h2 id="atlasHead">Where &amp; when</h2>
</section>

<div id="app"></div>

<!-- THE BOARD, at the foot of the page and NOT inside #app (Paul, 2026-08-24:
     "an actual mixing board at the end is a nice idea"). A board is not one of
     the eight axes and does not belong in the axes' container: it is what the
     record LANDS ON, and #app holds nothing but the eight and the producer's
     statement about them. draw() clears and refills this the same way it clears
     #app.
     THE REASON THIS COMMENT USED TO GIVE IS GONE, and it is rewritten rather
     than deleted because it was the wrong reason even while it was true: it
     said the div existed "for one structural reason: a console column is 40px
     wide, so the board's controls are <select>s, and D2's gate reads '#app
     select is empty'". That is a div drawn to stay outside a gate's reach, and
     STATE.md item 20 is what it cost — twenty-three dropdowns on the board that
     no gate could see. The board's controls are ranges and sheets now and the
     only reason left is the structural one above, which is the one that should
     have been written.
     (This went on to say "and the count outside the atlas is 0 page-wide".
     That stopped being true the same evening — Paul asked a named list of
     settled parameters back into menus and every one of them is inside #app —
     and it is rewritten rather than deleted because the number was never the
     point: what was wrong was a <div> placed where a gate could not look. The
     gate looks here now whatever the controls are. test/sheets.js check 1 was
     "#app select is empty" and is now "every menu in #app came from
     ui/selects.js and no development word is one", which is a rule about WHAT a
     menu may be rather than a count of them.) -->
<div id="deck"></div>

<script src="../engine/registry-data.js"></script>
<script src="../engine/faust/voices/sampler.js"></script>
<script src="../engine/faust/voices/found-player.js"></script>
<!-- the harmony brain before the kernel: optional by law, and the comping
     chair is voiced with it when it is in the room -->
<script src="../engine/theory.js"></script>
<script src="kernel.js"></script>
<script src="genres.js"></script>
<!-- WHICH WIKIPEDIA ARTICLE EACH ANCHOR IS (Paul, 2026-08-26: "add actual
     Wikipedia links for each genre we have at the top by the title"). GENERATED
     by nukernel/wiki-extract.js against a local ZIM on this box; the extractor
     itself gets NO tag, exactly as gates-extract.js gets none. After genres.js
     because it keys off genre keys, before ui/eight.js because draw() reads it.
     A LINK IS NOT A FETCH: nothing here costs a request. -->
<script src="wiki.js"></script>
<!-- THE QUESTIONS THE KERNEL'S OWN FIELDS ARE ASKED WITH (askable.js). It has
     no dependencies and publishes one global. fields.js `nudgesFor` reads the
     `stress` / `phrase` / `orn` rows off it so the Performance sheets say
     "does the line breathe? … it arches" in askable.js's words and not in a
     second copy of them. -->
<script src="askable.js"></script>
<script src="fields.js"></script>
<script src="song.js"></script>
<script src="instruments.js"></script>
<script src="compose.js"></script>
<script src="presets.js"></script>
<!-- THE RECORD ITSELF, as data: the eight axes and the word vocabulary they
     develop with. No LLM, no generation, no runtime surprises. -->
<script src="songs.js"></script>
<!-- HOW A DOCUMENT BECOMES A SCORE. Extracted from ui/eight.js, where the
     compiler had been living inside a view and had already been copied once
     into scratch/play-song.js. It reads kernel.js, genres.js, fields.js,
     song.js and songs.js, so it loads after all five and before the module
     tier; ui/deps.js is what hands it to a view. -->
<script src="document.js"></script>
<!-- WHERE THE DOCUMENT'S SOUND AXIS LANDS ON THE DESK. It reads fields.js only,
     and ui/eight.js's push() reads it, so it loads after fields.js and before
     the module tier — the same seam document.js takes above. -->
<script src="desk-doc.js"></script>
<!-- WHAT CAN BE SAID, AND WHAT SAYING IT WOULD DO. avail.js is the vocabulary
     of the sixteen sheets — the same rows the page draws and the extractor
     measures — and gates.js is the measured table of which option this record
     has made unreachable, GENERATED by nukernel/gates-extract.js and never
     typed. Both are UMD and read kernel/genres/fields/songs/instruments/
     document off window, so they load after all six and before the module
     tier; ui/deps.js is what hands them to a view. -->
<script src="avail.js"></script>
<script src="gates.js"></script>
<!-- …AND WHICH KNOBS A SEATED VOICE HAS, measured the same way (VOICE.md §2):
     nukernel/knobs-extract.js probes the parent's own pitchedUnit at both ends
     of every candidate `set` key and keeps the ones that moved a parameter.
     UMD, no DOM, no network, and it is the ONLY list of what an instrument
     editor may draw. -->
<script src="knobs.js"></script>
<!-- SET A GENRE, GET A WHOLE RECORD (D5). chair.js is the interview engine
     ideas-kit.js is written in, ideas-kit.js is the theme composer, and
     precompose.js is what projects compose()'s arrangement plus an idiomatic
     theme into the eight axes. Three classic scripts, no DOM, no network:
     verified in this browser building all 366 records with zero pageerrors and
     zero off-host requests, byte-identical to the same call under node. -->
<script src="chair.js"></script>
<script src="ideas-kit.js"></script>
<script src="precompose.js"></script>
<!-- THE PRODUCER (D4). "We've lost the producer entirely" (Paul, 2026-08-24) —
     and what was lost was its cast, its seam and its page, never its engine:
     producer.js is 1,700 lines of deterministic vector step in genre space and
     it has been sitting in this directory unloaded. It is UMD like every other
     file above and reads kernel.js, genres.js, fields.js and bass-kit.js off
     window, so it loads after all four. bass-kit.js comes with it because
     producer.js is its only reader on this page (STYLES / STYLEWORD / FIGURES —
     the words it says about a bass line); it reads chair.js and instruments.js,
     which are already here. No DOM, no audio, no network. -->
<script src="bass-kit.js"></script>
<script src="producer.js"></script>
<!-- WHERE AND WHEN THE RECORDS ARE (D6). atlas.js is 116 baked rows of place
     and year, extracted from the genres.js labels by
     `node nukernel/atlas.gate.js --bake` and never parsed at runtime;
     atlas-land.js is a coastline baked once by scratch/atlas/bake-land.js from
     Natural Earth 1:50m and 1:10m (public domain, provenance in SOURCES.md) —
     four tiers now, because the globe zooms from the whole earth to a city and
     the tolerance is set by the tightest view. Neither
     fetches anything, ever — the offline law — and atlas.js reads no other
     module, so it may sit anywhere after the classic tier. ui/deps.js is what
     hands both to the view. -->
<script src="atlas.js"></script>
<script src="atlas-land.js"></script>
<script type="module" src="ui/eight.js"></script>
</body>
</html>
