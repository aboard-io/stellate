<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The band — say it</title>
<meta name="description" content="A band: an arranger, a drummer, a bass player, a keys player and an engineer. The arranger calls the tune; everyone else decides what is theirs.">
<meta name="robots" content="noindex">
<!-- BASIC HTML, AND NO FORMATTING (Paul, 2026-08-21: "Just use basic HTML
     for everything right now… Don't style at all"; 2026-08-23: "Get rid of
     all text formatting just let the text be default size and everything
     even simpler"). One stylesheet, and it sets no font-size, weight,
     style, letter-spacing or case anywhere: the scroll pane a gate
     measures, state-swap rules, the visually-hidden helper, the staff SVG's
     containment, and the circle of fifths ("Keep the circle of fifths!!!" —
     the one sanctioned exception). Everything else is the browser's own
     defaults. -->
<link rel="stylesheet" href="band.css">
</head>
<body>

<!-- ONE PURPOSE, ONE PAGE, NO MODES, NOTHING FOLDED (2026-08-23, Paul:
     "put everything into a table and make it all fully expanded and simple
     to scroll"). Everything is on the page at once, top to bottom — themes,
     the song, the band, the producer — every region a real <table> with a
     <caption>, no <details> anywhere, and the only thing that moves is
     which question is in front of you. The transport is words: no dice
     glyph, no triangle, no circle-arrow; a button says what it does. -->
<main>
  <header>
    <h1>The band</h1>
    <!-- THE ONE DIV IN THE HEADER, and it earns it: a set of controls that
         is neither prose nor a landmark, named for assistive tech by
         role="group" + aria-label, which needs an element to sit on. The
         class it used to wear (.dtransport) styled nothing and no gate
         looked for it. -->
    <div role="group" aria-label="transport">
      <button id="dplay" type="button">play</button>
      <button id="ddice" type="button"
              title="a whole record by answering every question at random">roll a record</button>
      <!-- ANOTHER TAKE (Paul: "a reseed button to rebuild the current song
           with variation on its core identity"). NOT the dice: the dice
           throws the record away and answers everything again, this plays
           the SAME record a second time — same band, same tune, same desk,
           a different performance. band-kit `anotherTake`. -->
      <button id="dtake" type="button"
              title="the same record, played again — same band, same tune, a different performance">another take</button>
      <button id="dreset" type="button"
              title="put the room back to empty">start again</button>
      <!-- THE LISTENER'S KNOB (Paul: "I need a volume slider on the top very
           badly"). A plain range over the DEVICE volume — ui/state.js
           VOLSTORE, the same setting the daw's fader writes — never the
           engineer's desk (those are mix OFFSETS; this is the master the
           parent engine smooths on the audio thread). Wired in ui/band.js;
           audio/live.js already rides it both ways: masterVol at open, so it
           works before the engine boots, and setMasterVol on every
           "transport" commit, so a drag is heard mid-bar. -->
      <label for="dvol">volume</label>
      <input type="range" id="dvol" min="0" max="100" step="1" value="100">
      <!-- the beat counter (bar.beat) and the change countdown are plain
           text, fed by the engine's own clock (audio/live.js "pos" and
           "pending" events). Not live regions on purpose: they change every
           beat, and a screen reader that announces every beat is a metronome
           nobody asked for — which is also why they are plain <span>s and
           not <output>, whose implicit live region is exactly that
           metronome. They carry ids, not classes: nothing styles them. -->
      <span id="dbeat"></span>
      <span id="dpending"></span>
      <!-- ...but a change made SHOULD be said once: when a countdown's label
           first appears it lands here — one polite write per new label,
           never per beat (ui/band.js "pending"). Visually hidden; the eye
           reads #dpending. -->
      <span class="dvh" id="dlive" aria-live="polite"></span>
    </div>
  </header>
  <div class="dwrap" id="dwrap"></div>
</main>

<script src="../engine/registry-data.js"></script>
<script src="../engine/faust/voices/sampler.js"></script>
<!-- No speech.js here: nukernel does not sing (a fresh espeak heap per
     utterance took Safari out of memory). test/unit/nukernel.test.js §74
     holds it out; the parent's organ is untouched. -->
<script src="../engine/faust/voices/found-player.js"></script>
<!-- The harmony brain BEFORE the kernel: kernel.js picks up window.CsdTheory
     at load to voice the comping chair (shells, minimal motion). Optional by
     law - a page without it renders the stamped fold, byte-identical. -->
<script src="../engine/theory.js"></script>
<script src="kernel.js"></script>
<script src="genres.js"></script>
<script src="fields.js"></script>
<script src="song.js"></script>
<script src="instruments.js"></script>
<script src="compose.js"></script>
<script src="presets.js"></script>
<!-- the one chair every musician sits in: the interview engine the six
     kit files below are content over -->
<script src="chair.js"></script>
<script src="drums-kit.js"></script>
<script src="bass-kit.js"></script>
<script src="keys-kit.js"></script>
<script src="ideas-kit.js"></script>
<script src="guitar-kit.js"></script>
<script src="vocal-kit.js"></script>
<script src="askable.js"></script>
<script src="band-kit.js"></script>
<!-- THE PRODUCER — pure, node-loadable, and it makes no sound: it reads the
     record band-kit composed and moves it one deterministic vector step in
     genre space, scoped to a subsystem. After band-kit because it reads the
     same anchors, before the UI because ui/band.js takes it off window. -->
<script src="producer.js"></script>
<script type="module" src="ui/band.js"></script>
</body>
</html>
