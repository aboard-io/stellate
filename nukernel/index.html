<!-- ===== NINE TABS, AND THE PAGE STOPPED BEING ONE SCROLL =================
     Paul, 2026-08-27: *"Why don't we make tabs at the top level and let go of
     the idea of scrolling everything? The tabs are: Where / Tempo / Key /
     Motif / Band / Mix / Produce / Score / Export."*

     THIS RETIRES A FOUNDING LAW OF THIS SURFACE and the law is rewritten
     rather than deleted, because it was right for the page it was written
     about. It said: everything is on one page, in one scroll, nothing hidden
     anywhere (band.css:1), with two sticky bands — the transport, and the
     heading of the axis you are inside — so that a reader who scrolls six
     thousand pixels always knows which of the eight axes is under their
     thumb. Every word of that was true and it is what the sticky `<h2>`, the
     `--head-h` reserve, the golden-angle wash per section and the anchor
     machinery were all built to serve.

     WHAT ENDED IT is the number the law itself produced: seventeen thousand
     pixels at 390px, on a phone, for one record. "Nothing is hidden" and
     "you can find anything" stopped being the same sentence somewhere around
     the tenth screen. So the page is nine panels now, one visible at a time,
     and the sticky band that says where you are is the TAB ROW rather than a
     heading — one band that names all nine places instead of one band that
     names the place you happen to have scrolled into.

     WHAT SURVIVES THE REVERSAL, and each of these is a promise this file kept
     when it was one scroll:
       · NOTHING IS HIDDEN. Every control is one tap from every other control,
         and the tab that holds it is named on screen at all times. A tab is
         not a disclosure — the whole row is always visible, and no panel is
         behind a second panel.
       · THE PAGE IS STILL ONE DOCUMENT. The panels are in Paul's order in the
         source, and a closed panel is closed by a CLASS RULE
         (`.nu-pan[data-off]`), not by the `hidden` attribute — so with the
         stylesheet off this page still reads top to bottom as the same
         document it always did, all nine panels in order. `inert` is what
         keeps a closed panel out of the tab order in a browser that has the
         stylesheet on, which is the half `hidden` would have done.
       · YOU DO NOT LOSE YOUR PLACE. Each tab remembers its own scroll and gets
         it back on return (ui/eight.js `tabScroll`) — the anchor law's
         substance, with a new mechanism.
       · THE TRANSPORT IS NOT IN A TAB (see the .nu-bar note above).

     WHAT IT COSTS, MEASURED: two lines of tab row at 320-430px (103.4px) and
     one from 820px up (54.6px), and the page does not scroll sideways at any
     of the six widths — nu.css's `.nu-tabs` carries the arithmetic.

     THE ROW IS FILLED BY ui/eight.js AND NOT TYPED HERE, because the nine
     names are one fact and `TABS` in that file is their owner — a second copy
     in this file is exactly the drift the one-owner law exists to stop. The
     empty <p> ships here so the sticky band has its place in the document
     before a line of script runs. -->
<!-- ===== AND THE ROW BECAME A GUTTER, 2026-08-28 =======================
     Paul: *"Come up with a strategy for running the nav icons for a given
     modality down the right of the interface but translucent. Put them in a
     translucent tray. They're sort of like scrabble letters now. There should
     be one vertical stripe max with an 'up' icon to get to the parent level."*
     And, the same hour, twice: *"You know what don't make it translucent. Make
     it a fixed gutter"* and *"Dont let anything go under it."*

     THE TRANSLUCENCY WAS ASKED FOR AND WITHDRAWN INSIDE THE HOUR, and that is
     written down here so the next hand does not re-propose it. Enamel's
     flat-paint law — flat colour, hard shadow, no blur anywhere — is NOT
     reversed. The tray is OPAQUE, painted in the same `--panel` plate the
     transport is, with one full-ink rule down its inner edge.

     `<nav>` AND NOT `<p>`, AND IT STANDS EXACTLY WHERE `#toptabs` STOOD. The
     element it replaces was `<p id="toptabs" class="nu-row nu-tabs">`, the
     second sticky band, and its position in the source is the whole reason
     this one is here rather than at the foot of <body> with `#nu-say`: with
     the stylesheet off `position: fixed` is gone and this is an ordinary block
     in flow, so the page's navigation has to READ before the panels it
     navigates, exactly as the row did. DOM order is reading order is tab
     order.

     IT IS A CONTROL SURFACE, so it is outside `#app` (draw() empties panels)
     and `window.__eightFrozen` never sees it.

     ===== ...AND IT GREW A FOOT THE CLOCK MAY WRITE IN, 2026-08-28 =========
     This sentence used to end "and outside every `[data-live]` subtree — the
     clock may not write a single character in here". It is REWRITTEN rather
     than deleted because it is still true of everything it was written about,
     and what is true of the rest is exactly what makes the exception safe.

     Paul: *"Add a logger on the bottom right. … Make the logger also have a
     countdown for when I change things, showing how many beats before they
     take effect."* A countdown is the clock speaking — nothing else can say
     how many beats are left — so it has to be written from the transport feed,
     and it has to be down here, because this is where the logger is.

     THE LAW THAT ALLOWS IT IS THE LAW ITSELF, unchanged (ui/eight.js, WHAT THE
     CLOCK MAY WRITE): *"the transport feed may only write inside an element
     carrying `data-live`, OR OUTSIDE #app ENTIRELY."* The gutter is outside
     #app — that is the clause `#engine` lived under for its whole life, four
     lines under the transport, and the readout that was there is IN here now.
     So the foot is legal twice over and it declares itself anyway: ui/eight.js
     builds `.nu-traycut`, then a `[data-live="pending"]` box that holds the
     countdown AND NO CONTROL, then the logger's button. The badge and the
     open/close button are controls and sit OUTSIDE that box, which is the same
     division the score deck makes between its live paper and its two view
     buttons.
     THE LEVELS ARE UNTOUCHED. `.nu-trayhead` and `.nu-traylist` — `↑` and the
     set of siblings you are among — are still written by a hand and only by a
     hand: `paintTray` is called from a click, from `showTab`, from `draw` and
     from `window.__eightTray`, and from nowhere else. Nothing about the stripe
     repaints on a beat.

     THE NINE NAMES ARE STILL NOT TYPED HERE. `TABS` in ui/eight.js is their
     one owner and `trayRow`/`paintTray` fill this; the empty <nav> ships so
     the gutter has its place in the document before a line of script runs.

     WHAT THE ROW COST AND WHAT THE GUTTER COSTS. Nine 44px targets are 396px
     against the 366 a 390px phone leaves, so `#toptabs` was two lines —
     103.39px of vertical band — at every phone width and no arrangement could
     have made it one. Turned on their side the same nine are 396px against
     844 and fit twice over. The gutter takes 56px of WIDTH instead, once, for
     every level: measured, the content column at 390 is 310px rather than 366
     and 103.39px of height comes back; at 1280 it is 1200 rather than 1256 and
     54.62px comes back. The three nested strips it also absorbs (`#tabs`,
     `#motif-tabs`, the deck's notation/roll pair) were another 44.00px of band
     each, on the tab you happened to be on.
     -->
<nav id="nu-tray" class="nu-tray" aria-label="where you are"></nav>

<h2 id="atlasHead">Where &amp; when</h2>
</section>

     `holdHeight` props open across a rebuild. Everything that was ONE `.nu-ax`
     per axis inside it still is; what changed is that each axis now sits in
     its own panel, and only one of the four is on the page at a time.
     (Tempo and Key are Paul's names for what this page draws as the Time and
     Alphabet axes — AXES.md carries the join, exactly as it does for
     Material/Motif.) -->
<div id="app">
  <div id="pan-tempo" class="nu-pan"></div>
  <div id="pan-key" class="nu-pan"></div>
  <div id="pan-motif" class="nu-pan"></div>
  <div id="pan-band" class="nu-pan"></div>

<!-- THE EXPLAINER'S ONE BOX (Paul, 2026-08-28: "Provide a simple long tap or
     hover tooltip to explain what they are"). Every tab on this page is a
     glyph now, and a glyph that a person cannot read is a control with no
     name; ui/glyph.js fills this on hover and on a 450ms hold and empties it
     on Escape, on a scroll and on the next press.

     IT SHIPS HERE, EMPTY, AND THAT IS THE WHOLE ARGUMENT FOR IT BEING IN THIS
     FILE. Three separate promises are structural rather than remembered:
       · it is OUTSIDE #app, so draw() cannot destroy it mid-explanation and
         `window.__eightFrozen` never sees it — the same reason #engine and the
         atlas are outside (see their notes above);
       · it is outside every `[data-live]` subtree, so the clock can never
         write here and the "playback mutates nothing outside [data-live]"
         claim is untouched by a popover being open while the record plays;
       · it is LAST in <body> and `position: fixed` (nu.css), so it is
         positioned and never inserted into flow — opening one cannot reflow a
         row under a thumb, which is the failure a tooltip would otherwise be.
     `hidden` while shut, so the text diet never counts words nobody can see,
     and `role="tooltip"` with nothing focusable in it, because it is an
     explanation and not a control. -->
<div id="nu-say" role="tooltip" class="nu-say" hidden></div>

<!-- THE LOGGER'S OWN PAGE (Paul, 2026-08-28: "Add a logger on the bottom
     right. Log actions."). The BUTTON and the BADGE are in the gutter's foot,
     built by ui/eight.js beside the marks they belong with; this is the sheet
     that opens when you press it, and it ships here for the three reasons
     `#nu-say` ships here, one line above:
       · it is OUTSIDE #app, so draw() cannot destroy the log you are reading
         in the middle of reading it, and `window.__eightFrozen` never sees it;
       · it is `position: fixed` (nu.css), so opening it is POSITIONING and
         never insertion — the page under it does not move by a pixel, which is
         the whole difference between a panel and a layout bug on this page;
       · it is LAST in <body>, so with the stylesheet off it reads as what it
         is: an appendix at the end of the document, after the nine panels,
         rather than a block wedged between the transport and the record.

     `hidden` WHILE SHUT, which is not decoration: the text diet counts words a
     reader can see, and a log is the one surface here that grows without
     anybody writing prose. Shut, it is not on the page and is not counted;
     open, it is counted honestly.

     `role="log"` AND NOT `role="dialog"`. It traps no focus and takes nothing
     over — the record goes on playing behind it, the transport is still one
     press away, and Escape closes it exactly as it closes the explainer. What
     it is, is a running list of things that already happened, and that is the
     one role in ARIA that means precisely that.
     `aria-live="off"`: role="log" would otherwise announce every engine
     sentence to a screen reader for the whole length of the record, which is
     the machine talking over the music. It is READ when it is opened, and it
     is opened by a hand. -->
<div id="nu-log" class="nu-log" role="log" aria-live="off"
     aria-label="log" hidden></div>
