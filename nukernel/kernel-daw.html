<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Boxes — nukernel</title>
<meta name="description" content="Build a song from boxes. One 16-step phrase reads as a fugue, acid house, vaporwave, twelve-bar blues or rock.">
<meta name="robots" content="noindex">
<!-- hw.css first: it owns every token, size and face; kernel-daw.css finishes
     the declarations it leaves open (the pages.css + how.css pattern). The
     static data-theme="light" on <html> pins the LIGHT face as the shipped
     default; the dark face is one attribute away. Since the flat pass
     (2026-08-16) hw.css carries no material recipes at all — surfaces, rules,
     ink, one accent, the state/category/level colours, a type scale and a
     space scale. The meaning colours never invert. -->
<link rel="stylesheet" href="hw.css">
<link rel="stylesheet" href="kernel-daw.css">
</head>
<body>

<!-- THE CHASSIS. Three fixed zones AT EVERY WIDTH now (2026-08-16, "get rid
     of the non-mobile vertical UX") — transport strip on top, the current
     PAGE in the middle, the page rail under the thumb. A wide window does
     not dissolve the zones into a stacked column; it gives the same tables
     more room (wider columns, taller rows — kernel-daw.css's own media step).
     One mental model, never a second layout to keep in sync with this one.
     Switching pages is ONE attribute write (data-page below); no view is ever
     rebuilt for it, so every module's elements stay alive and patched
     whichever page is showing — and the page, plus whichever phrase or
     section it is showing, round-trips through the URL (ui/pages.js). -->
<div class="chassis" id="chassis" data-page="song">

  <!-- ZONE 1 · TRANSPORT — always on screen. Play, the composer as a
       hardware WRITE key (genre picker, the seed on its own little LCD, and
       ⟳ to roll the same genre again), tempo and volume, and the position
       readout. The session keys (save/load/reset/font/presets) are NOT here:
       they are song operations, not performance controls, and they live on
       the SONG page instead of under a thumb. -->
  <!-- TWO CLUSTERS, one panel: the GO cluster (play + the write group) on the
       left, the SETTINGS cluster (tempo, volume, position) pushed right as a
       UNIT. The clusters are real wrappers so a narrow desk wraps a whole
       cluster, never one lonely fader — VOLUME on a row of its own with the
       position LCD floating far right was exactly the failure. On a phone both
       dissolve (display:contents / a full-width row) into the two-line stack. -->
  <header class="bar transport">
    <h1 class="mast">Song <em>boxes</em></h1>
    <div class="tgo">
      <button class="btn go" id="play">▶ Play</button>
      <div class="write">
        <button class="btn go" id="compose" title="write a whole song in the picked genre">✎ Write</button>
        <label class="knob"><span>Genre</span>
          <select id="composeg"></select></label>
        <output class="seedlcd" id="seedlcd"
          title="the composer's seed — the same number is the same song">········</output>
        <button class="btn" id="reroll" title="same genre, new seed" aria-label="recompose: same genre, new seed">⟳</button>
      </div>
    </div>
    <!-- the fader legends are TWO spans: the full word for a desk, the
         abbreviation for a phone (the CSS swaps them). The phone used to hide
         the labels entirely — two bare faders whose LCDs said 126 and 80 with
         nothing saying WHAT — and abbreviating beats hiding: a legend is the
         silkscreen, not decoration. The accessible name is the full word both
         ways (aria-hidden on the abbreviation, never on the label). -->
    <div class="tset">
      <div class="knob"><label for="bpm">Tempo</label>
        <input type="range" id="bpm" min="70" max="160" value="126"><b id="bpmv">126</b></div>
      <div class="knob"><label for="vol"><span class="lf">Volume</span><span
          class="la" aria-hidden="true">Vol</span></label>
        <input type="range" id="vol" min="0" max="100" value="80"><b id="volv">80</b></div>
      <output class="poslcd" id="lcdpos" aria-label="playback position">--</output>
    </div>
  </header>

  <!-- ZONE 2 · THE DECK — one page at a time on a phone, all four on a desk.
       FOUR pages ("compose, arrange, mix" + the LAB, 2026-08-16): ARRANGE (the
       song table — internal key "song", the section rows and the song-level
       banks), COMPOSE (the phrase editor as a FULL PAGE again — the modal died;
       a PATTERN thumbnail on Arrange navigates here with that phrase loaded,
       ui/editor.js builds the page's insides into #composewrap, ids intact),
       MIX (the board) and LAB (the bench where genres are crossed — pick two or
       three parents and the machine fills the ARCHITECTURE it can actually
       predict, leaving the MATERIAL to a person; ui/lab.js builds it into
       #labwrap). Every per-box control is still a menu off the song
       row's cells (ui/songrow.js + ui/palette.js mountBanks). There is no
       context strip: a menu opens ON the row it edits, so nothing edits a box
       from a page the box is not on. -->
  <main class="deck">

    <section class="page pg-song" id="page-song" aria-label="arrange">
      <div class="ed songwrap">
        <!-- NO HEAD. The page is reached by a lit SONG tab and its first
             element is the song table, so an h2 reading "Song" named what the
             tab already said, and the (?) beside it explained a table you can
             simply tap (Ford, 2026-08-15: "get rid of the song title for the
             song area and the question ... we're just going to tap on things
             and figure it out"). -->
        <!-- THE SONG TABLE: ui/songrow.js builds a header row, one row per
             section (kept alive and patched, never rebuilt) and a footer row
             of table keys. Rows at every width — the desk gets more columns,
             not a different view — and the same well, ruling and row states
             the pattern and the arrangement wear. -->
        <div class="song tbl" id="song"></div>
        <!-- THE INSTRUMENT POOL AND THE SESSION BANK ARE OFF THIS PAGE NOW
             ("move all the sound definition and saving functionality into
             mix", Paul, 2026-08-16) — lane A3 is building their real home on
             the MIX page. HIDDEN here rather than deleted: ui/poolbank.js and
             ui/chrome.js both bind these ids unconditionally at module load
             (querySelector/getElementById().addEventListener with no null
             guard on #savefile etc.), so removing the markup before the Mix
             page grows the same ids would crash the whole app's boot for
             every lane, not just this one's surface. `hidden` takes them out
             of layout, the tab order and the accessibility tree — gone for
             every purpose Paul asked for — while the ids stay live for the
             modules that still reach for them. Delete this block outright
             once the Mix-page versions exist. -->
        <div class="gbank tbl poolbank" id="poolbank" aria-label="instruments" hidden>
          <div class="poolrows"></div>
        </div>
        <div class="gbank tbl" aria-label="session" hidden>
          <div class="gitems">
            <label class="gctl"><span class="glab">Groove</span>
              <select id="groove"></select></label>
            <label class="gctl"><span class="glab">Swing</span>
              <select id="swing"></select></label>
            <label class="gctl"><span class="glab">Soundfont</span>
              <select id="font"></select></label>
            <label class="gctl"><span class="glab">Songs</span>
              <select id="preset"><option value="">choose…</option></select></label>
            <div class="gctl"><span class="glab">Song file</span>
              <span class="ukeys">
                <button class="btn ik ik-save" id="savefile" title="save the song to a file">
                  <span class="k" aria-hidden="true"></span><span class="t">Save</span></button>
                <button class="btn ik ik-load" id="loadfile" title="load a song file">
                  <span class="k" aria-hidden="true"></span><span class="t">Load</span></button>
                <input type="file" id="loadinput" accept="application/json,.json" hidden>
                <button class="btn ik ik-reset" id="reset" title="reset everything to the default song">
                  <span class="k" aria-hidden="true"></span><span class="t">Reset all</span></button>
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- THE COMPOSE PAGE — the phrase editor as a place you GO ("compose,
         arrange, mix", 2026-08-16; plain and icon-only, 2026-08-17). ui/editor.js
         builds everything inside #composewrap — the tracker (#stepgrid, 1..128
         rows), the length/Seed/Random/Clear icon row, and the phrase TRAY
         (#slots) — with the ids the modal carried, because the gates read
         them. A PHRASE thumbnail or [+] on an Arrange row NAVIGATES here with
         that phrase loaded; the tray at the bottom is where a phrase toggles
         into the selected box's focused layer, and where it is cloned or
         deleted (each pad's own icons, not a paired bank [+]/[−] any more). -->
    <section class="page pg-compose" id="page-compose" aria-label="compose">
      <div class="ed composewrap" id="composewrap"></div>
    </section>

    <!-- THE MIX PAGE — the BOARD over the RACK ("the SSL board", 2026-08-16).
         The board is vertical channel strips, one per part the selected box
         sounds (the same roster audio/mixer.js builds channels from), then the
         SECTION strip under a heavier rule (every part bus feeds it), then the
         shared-bus strips (reverb, echo, drum room — graph.js's own roster)
         and the MASTER strip with its meter. Each channel strip carries its
         label block, its value keys (fx/rev/echo/lvl/pan — the same chips,
         the same saved fields the old table wrote), M/S, and a long-throw
         AUTOMATED fader: the cap follows the level actually driving the
         channel and a drag stores a dB OFFSET on top of it (fields.js
         `fader`). Below the board, the EFFECTS RACK: one knob row per shared
         bus plus the MASTER row, moved here off the SONG page (ids #m-<key>
         kept). ui/mixtbl.js builds both wells. -->
    <section class="page pg-mix" id="page-mix" aria-label="mix">
      <div class="ed">
        <!-- NO HEAD, NO (?). The page is reached by a lit MIX key and its
             first element is the board, so an h2 reading "Mix" named what the
             key already said; the (?) beside it carried a paragraph
             explaining strips you can simply tap ("get rid of headers and
             help buttons", 2026-08-16). The explanation is deleted rather
             than hidden — a control that needs a paragraph is a control that
             is wrong. -->
        <div class="mixtbl board tbl" id="mixtbl"></div>
        <div class="rack tbl" id="rack"></div>
      </div>
    </section>

    <!-- THE LAB PAGE — the bench where genres are crossed (nukernel/lab.js is
         the engine, ui/lab.js the view). Empty in the markup on purpose, like
         #composewrap: the whole surface is built by its module, and the module
         is not even fetched until the tab is first opened (ui/deps.js
         loadLab()), because the bench and its two oracles are ~123 KB of
         analysis tier that most sessions never ask for.

         WHAT IT IS FOR, in one line, because it decides the layout: measured
         over the catalog (nukernel/INHERITANCE.md), crossing parents predicts a
         genre's ARCHITECTURE (harmony 87%, realize 84%, rate 76%, drumkit 61%)
         and essentially NONE of its MATERIAL (kit 16%, roots 7%, fill/instr 3%,
         prog/words 0%). So the page reads as that division of labour: the
         architecture arrives as read-only FACTS with their provenance printed,
         and the material arrives as an INVENTION LIST with a roll key on every
         row. -->
    <section class="page pg-lab" id="page-lab" aria-label="lab">
      <div class="ed labwrap" id="labwrap"></div>
    </section>

  </main>

  <!-- the LCD line: what the selected box is, or the last status. Chassis
       level, not inside a page, so it stays lit on a phone whichever page is
       up — hold a box and the words land HERE, visibly. -->
  <p class="readout" id="readout"></p>

  <!-- ZONE 3 · PAGE RAIL — hardware mode keys, on screen at every width now.
       Lowercase in the markup (values, not silkscreen); the CSS uppercases
       the legends. Each key wears a small silkscreen icon above its word
       (.pi, an SVG-mask painted with currentColor — self-contained, no
       glyph-coverage lottery).

       REAL LINKS NOW (Paul: "every nav element should have a URL") — a real
       href beside the tab semantics, so a right-click copies a real address
       and a modified click opens a real tab, while a plain tap still runs
       through ui/pages.js setPage() so the address it lands on carries the
       phrase or section that page is showing, not a bare page name
       (ui/pages.js's own router comment says the scheme).

       FOUR KEYS: COMPOSE (the phrase editor page), ARRANGE (the song table —
       its internal key stays "song": nothing but the silkscreen ever said the
       word, and the CSS/gate hooks .pg-song/[data-page="song"] stay true), MIX
       (the board) and LAB (the genre bench). The rail order is the verbs'
       order — what you do to a phrase, a song, a sum, and then the thing you
       make the parts out of. LAB is LAST: it is where a new genre comes from,
       not where a song is made, and it must never sit between a person and
       their song. -->
  <nav class="pagerail" role="tablist" aria-label="pages">
    <a class="pkey" role="tab" href="#/compose" data-page="compose" aria-controls="page-compose" aria-selected="false"><span class="pi" aria-hidden="true"></span>compose</a>
    <a class="pkey" role="tab" href="#/song" data-page="song" aria-controls="page-song" aria-selected="true"><span class="pi" aria-hidden="true"></span>arrange</a>
    <a class="pkey" role="tab" href="#/mix" data-page="mix" aria-controls="page-mix" aria-selected="false"><span class="pi" aria-hidden="true"></span>mix</a>
    <a class="pkey" role="tab" href="#/lab" data-page="lab" aria-controls="page-lab" aria-selected="false"><span class="pi" aria-hidden="true"></span>lab</a>
  </nav>

</div>

<!-- order matters, and it is the layer graph: the sampled engine, the algebra
     (kernel), the genre table (genres), the control vocabulary (fields), pure
     persistence (song), the sound sources (instruments), arranger policy
     (compose), the shipped songs (presets), then — only then — the UI.
     The UI is ONE module entry: ui/main.js imports the ui/ and audio/ tiers
     in layer order (ui/deps.js is the sole reader of these globals). A module
     script is deferred, so it always runs after every classic script here. -->
<script src="../engine/registry-data.js"></script>
<script src="../engine/faust/voices/sampler.js"></script>
<!-- the parent's SPEECH and FOUND organs, borrowed whole (nukernel/audio/sing.js
     says exactly what for). speech.js resolves the vendored espeak glue
     relative to ITS OWN src, so loading it from ../engine/ lands on
     /vendor/espeak-ng/ and not on /nukernel/vendor/ — and it only dynamic-
     imports that 1.7 MB the first time something actually sings. -->
<script src="../engine/speech.js"></script>
<script src="../engine/faust/voices/found-player.js"></script>
<script src="kernel.js"></script>
<script src="genres.js"></script>
<script src="sing.js"></script>
<script src="fields.js"></script>
<script src="song.js"></script>
<script src="instruments.js"></script>
<script src="compose.js"></script>
<script src="presets.js"></script>
<script type="module" src="ui/main.js"></script>
</body>
</html>
