<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Boxes — nukernel</title>
<meta name="description" content="Build a song from boxes. One 16-step phrase reads as a fugue, acid house, vaporwave, twelve-bar blues or rock.">
<meta name="robots" content="noindex">
<!-- hw.css owns the tokens; kernel-daw.css finishes the declarations it
     leaves open. data-theme="light" pins the shipped face. -->
<link rel="stylesheet" href="hw.css">
<link rel="stylesheet" href="kernel-daw.css">
</head>
<body>

<!-- THE CHASSIS: transport on top, one PAGE in the middle, the rail under
     the thumb — the same three zones at every width. Switching pages is one
     data-page write; every page's elements stay alive. Routing: ui/pages.js. -->
<div class="chassis" id="chassis" data-page="song">

  <!-- ZONE 1 · TRANSPORT: one row, icon-only keys, tempo/volume inline.
       Session keys live in the mix page's drawers, not here. -->
  <header class="bar transport">
    <h1 class="mast">Song <em>boxes</em></h1>
    <div class="trow">
      <button class="btn go ik ik-play" id="play" type="button"
        title="play" aria-label="play"><span class="k" aria-hidden="true"></span></button>
      <button class="btn go ik ik-write" id="compose" type="button"
        title="write a whole song in the picked genre"
        aria-label="write a whole song in the picked genre"><span class="k" aria-hidden="true"></span></button>
      <!-- loop: ON = the record repeats; OFF = once through, then stop
           (ui/chrome.js). -->
      <button class="btn ik ik-loop" id="loop" type="button" aria-pressed="true"
        title="song loops — tap to play once and stop"
        aria-label="song loops — tap to play once and stop"><span class="k" aria-hidden="true"></span></button>

      <button class="btn ik ik-reroll" id="reroll" type="button"
        title="same genre, new seed" aria-label="recompose: same genre, new seed"><span class="k" aria-hidden="true"></span></button>
      <!-- fader legends: one-letter silkscreen visible, full word kept for
           the accessible name (clip-path, never display:none). -->
      <div class="knob"><label for="bpm"><span class="lf">Tempo</span><span
          class="la" aria-hidden="true">T</span></label>
        <input type="range" id="bpm" min="70" max="160" value="126"><b id="bpmv">126</b></div>
      <div class="knob"><label for="vol"><span class="lf">Volume</span><span
          class="la" aria-hidden="true">V</span></label>
        <input type="range" id="vol" min="0" max="100" value="80"><b id="volv">80</b></div>
    </div>
    <!-- ROW 2: the genre lozenge (says the genre AND opens the picker —
         #composeg is a real <select> stretched over the pill; gates drive it
         by id), the surprise key, and the position readouts. -->
    <p class="readout posrow" id="readout">
      <span class="genrelz">
        <span class="k" aria-hidden="true"></span>
        <output class="posgen" id="posgenre"></output>
        <select id="composeg" title="genre — pick one and it writes a song in it"
          aria-label="genre — pick one and it writes a song in it"></select>
      </span>
      <button class="btn ik ik-rnd posk" id="surprise" type="button"
        title="surprise me: write a song in a genre picked at random"
        aria-label="surprise me: write a song in a genre picked at random"><span
        class="k" aria-hidden="true"></span></button>
      <output class="posf poslcd" id="lcdpos" aria-label="playback position">--</output>
      <output class="posf" id="possection"></output>
      <output class="posmsg" id="posmsg"></output>
    </p>
  </header>

  <!-- ZONE 2 · THE DECK: COMPOSE (phrase editor, ui/editor.js →
       #composewrap), ARRANGE (song table, internal key "song"), MIX
       (ui/mixer.js), LAB (ui/lab.js → #labwrap). One page shows at a time;
       menus open on the row they edit. -->
  <main class="deck">

    <section class="page pg-song" id="page-song" aria-label="arrange">
      <div class="ed songwrap">
        <!-- THE SONG TABLE: ui/songrow.js — a header row, one row per
             section, kept alive and patched. -->
        <div class="song tbl" id="song"></div>

      </div>
    </section>

    <!-- COMPOSE: ui/editor.js builds the grid, the icon row and the phrase
         tray into #composewrap (gate-read ids). -->
    <section class="page pg-compose" id="page-compose" aria-label="compose">
      <div class="ed composewrap" id="composewrap"></div>
    </section>

    <!-- THE MIX PAGE — a drilldown list (ui/mixer.js): one row per channel,
         tap to open its modules, drag sideways to trim. What a drag writes is
         an OFFSET over the composed mix, for the whole record. Below the
         board: the band-casting and session drawers (ui/poolbank.js,
         ui/chrome.js). -->
    <section class="page pg-mix" id="page-mix" aria-label="mix">
      <div class="ed">
        <div class="mixtbl" id="mixtbl"></div>
        <details class="mixplug">
          <summary title="cast the band"><i class="k ik-cast" aria-hidden="true"></i></summary>
          <div class="gbank tbl poolbank" id="poolbank" aria-label="instruments">
            <div class="poolrows"></div>
          </div>
        </details>
        <details class="mixplug">
          <summary title="groove, swing, soundfont, songs, save and load"><i class="k ik-save" aria-hidden="true"></i></summary>
          <div class="gbank tbl" aria-label="session">
            <div class="gitems">
              <label class="gctl"><span class="glab">Groove</span>
                <select id="groove"></select></label>
              <label class="gctl"><span class="glab">Swing</span>
                <select id="swing"></select></label>
              <label class="gctl"><span class="glab">Soundfont</span>
                <select id="font"></select></label>
              <label class="gctl"><span class="glab">Songs</span>
                <select id="preset"><option value="">choose…</option></select></label>
              <div class="gctl"><span class="glab">Song file</span>
                <span class="ukeys">
                  <button class="btn ik ik-save" id="savefile" title="save the song to a file">
                    <span class="k" aria-hidden="true"></span><span class="t">Save</span></button>
                  <button class="btn ik ik-load" id="loadfile" title="load a song file">
                    <span class="k" aria-hidden="true"></span><span class="t">Load</span></button>
                  <input type="file" id="loadinput" accept="application/json,.json" hidden>
                  <button class="btn ik ik-reset" id="reset" title="reset everything to the default song">
                    <span class="k" aria-hidden="true"></span><span class="t">Reset all</span></button>
                </span>
              </div>
            </div>
          </div>
        </details>
      </div>
    </section>

    <!-- LAB: the genre bench (nukernel/lab.js engine, ui/lab.js view).
         Fetched on first open (ui/deps.js loadLab()); plays what you cross. -->
    <section class="page pg-lab" id="page-lab" aria-label="lab">
      <div class="ed labwrap" id="labwrap"></div>
    </section>

  </main>

  <!-- ZONE 3 · PAGE RAIL: real <a href> keys; a plain tap routes through
       ui/pages.js setPage(). The last key is a plain link out to the
       screensaver (the star map). -->
  <nav class="pagerail" role="tablist" aria-label="pages">
    <a class="pkey" role="tab" href="#/compose" data-page="compose" aria-controls="page-compose" aria-selected="false"><span class="pi" aria-hidden="true"></span>compose</a>
    <a class="pkey" role="tab" href="#/song" data-page="song" aria-controls="page-song" aria-selected="true"><span class="pi" aria-hidden="true"></span>arrange</a>
    <a class="pkey" role="tab" href="#/mix" data-page="mix" aria-controls="page-mix" aria-selected="false"><span class="pi" aria-hidden="true"></span>mix</a>
    <a class="pkey" role="tab" href="#/lab" data-page="lab" aria-controls="page-lab" aria-selected="false"><span class="pi" aria-hidden="true"></span>lab</a>
    <a class="pkey" href="../screensaver.html" title="the star map, playing on its own"><span class="pi" aria-hidden="true"></span>screensaver</a>
  </nav>

</div>

<!-- LOAD ORDER IS THE LAYER GRAPH: engine, kernel, genres, fields, song,
     instruments, compose, presets, then the one module entry (ui/main.js,
     deferred, so it runs after every classic script). -->
<script src="../engine/registry-data.js"></script>
<script src="../engine/faust/voices/sampler.js"></script>
<!-- No speech.js here: nukernel does not sing (a fresh espeak heap per
     utterance took Safari out of memory). test/unit/nukernel.test.js §74
     holds it out; the parent's organ is untouched. -->
<script src="../engine/faust/voices/found-player.js"></script>
<script src="kernel.js"></script>
<script src="genres.js"></script>
<script src="fields.js"></script>
<script src="song.js"></script>
<script src="instruments.js"></script>
<script src="compose.js"></script>
<script src="presets.js"></script>
<script type="module" src="ui/main.js"></script>
</body>
</html>
