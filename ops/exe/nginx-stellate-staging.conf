# stellate staging on exe.dev — https://stellate.exe.xyz:8100/ (2026-09-14).
#
# THE SAME SITE ON A SECOND PORT, AND THE PORT IS THE ACCESS CONTROL. exe.dev
# forwards 3000–9999 only to people with access to the VM, however public port
# 80 is, so this block needs no auth of its own. Filled by
# `scripts/deploy stellate --stage` through tools/deploy/deploy-nukernel-staging.sh.
#
# EVERYTHING THE PAGE NEEDS IS HERE AND NOTHING IS COPIED TWICE. The deploy
# writes ~24 MB of code into /srv/stellate-test; `found/` (765 MB of audio) and
# `old/` (the archive) are symlinks into production's tree, made by the deploy.
#
# It mirrors nginx-stellate.conf in everything a page can tell apart — the
# isolation headers above all, since the ring engine throws without them — and
# differs in three ways: the port, the root, and it counts nothing and is never
# indexed. A header change to production belongs here too.
server {
  listen 8100 default_server;
  listen [::]:8100 default_server;
  root /srv/stellate-test;
  index index.html;
  server_name _;
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_types application/javascript application/json application/wasm text/css application/xml;
  gzip_min_length 1024;

  add_header Cross-Origin-Opener-Policy  "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-cache";

  location / { try_files $uri $uri/ @old; }
  location @old { return 301 /old$request_uri; }

  location /old/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }
  location /nukernel/ { return 301 /$is_args$args; }

  location /found/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }

  location /engine/faust/dist/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }

  # Staging counts nothing: a visit here is somebody checking a build.
  location /gc/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    return 204;
  }
  location /stats { return 404; }

  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location = /feed.xml          { types {} default_type application/rss+xml;   add_header Cache-Control "no-cache"; }
  location = /feed-archive.xml  { types {} default_type application/rss+xml;   add_header Cache-Control "no-cache"; }
  location = /feed.json         { types {} default_type application/feed+json; add_header Cache-Control "no-cache"; }
  location = /feed-archive.json { types {} default_type application/feed+json; add_header Cache-Control "no-cache"; }
  location = /sitemap.xml       { types {} default_type application/xml;       add_header Cache-Control "no-cache"; }
}
