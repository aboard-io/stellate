# stellate on exe.dev — the droplet's vhost, adapted (2026-09-11).
#
# THE ISOLATION HEADERS ARE THE LOAD-BEARING PART, exactly as they are on the
# droplet: the ring engine throws without SharedArrayBuffer, and SAB needs
# cross-origin isolation. exe.dev's proxy terminates TLS in front of this and
# adds X-Forwarded-*; everything below is this server's own.
#
# add_header DOES NOT INHERIT into a location that sets its own, which is why
# the two isolation lines are repeated in every block that adds a header. That
# trap cost the droplet an evening and is written down there too.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  root /srv/stellate-nu;
  index index.html;
  server_name _;

  # ===== THE EDGE TERMINATES TLS, SO THIS SERVER NEVER SEES https =========
  # (2026-09-11.) Measured on the live VM: the page loads over HTTPS, nginx
  # answers a redirect, and the Location comes back `http://stellate.exe.xyz/…`
  # because nginx builds an absolute URL out of the scheme IT was spoken to
  # on — and exe.dev's proxy speaks plain HTTP to port 80. The browser then
  # refuses the downgrade as mixed content, the app's own fetches fail with
  # ERR_FAILED, and the page reloads for ever. Paul, on the migrated site:
  # *"it keeps constantly reloading and saying a problem occurred."*
  #
  # `absolute_redirect off` is the whole fix and it is the right one: every
  # redirect this file issues is same-origin (`/old$request_uri`, `/$is_args`),
  # so a RELATIVE Location says exactly what was meant and carries no scheme to
  # get wrong. The alternative — reconstructing the scheme from
  # X-Forwarded-Proto — is a second source of truth about a URL we already
  # know is ours.
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_types application/javascript application/json application/wasm text/css application/xml;
  gzip_min_length 1024;

  add_header Cross-Origin-Opener-Policy  "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cache-Control "no-cache";

  # A path this site has is served; a path only the archive has goes to the
  # archive, query string intact. Hash fragments never reach a server, so a
  # #at=…&y=… share link is untouched either way.
  location / { try_files $uri $uri/ @old; }
  location @old { return 301 /old$request_uri; }

  # THE ARCHIVE — the star map, frozen, reached through /srv/stellate-nu/old.
  location /old/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }
  # …and it installs no worker: both trees name their caches stellate-app-<v>
  # and each one's activate deletes what is not its own, which on ONE origin is
  # an eviction loop. The archive runs from the network.
  location = /old/sw.js {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-store";
    default_type text/javascript;
    return 200 "self.addEventListener('install',e=>self.skipWaiting());\nself.addEventListener('activate',e=>e.waitUntil((async()=>{for(const k of await caches.keys())if(k.startsWith('stellate-app-'))await caches.delete(k);await self.registration.unregister();const cs=await self.clients.matchAll({type:'window'});for(const c of cs)c.navigate(c.url);})()));\n";
  }

  # ONE FRONT DOOR: the root only, with /nukernel/ a redirect carrying its query.
  location /nukernel/ { return 301 /$is_args$args; }

  # Media is versioned by name -> immutable. The two exceptions inside found/
  # are NOT versioned by name and must stay refreshable.
  location /found/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    location = /found/tw_vocal.mp3 {
      add_header Cross-Origin-Opener-Policy  "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cache-Control "no-cache";
    }
    location ~* ^/found/.*\.json$ {
      add_header Cross-Origin-Opener-Policy  "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cache-Control "no-cache";
    }
  }
  # compiled wasm is CODE — it changes under the same name when a .dsp
  # recompiles, so it is no-cache like JS and never immutable.
  location /engine/faust/dist/ {
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache";
  }

  # ===== THERE IS NO ANALYTICS BACKEND ON THIS HOST (2026-09-11) ==========
  # The droplet proxies /gc/count to a GoatCounter running on localhost; this
  # VM has none. The page's beacon is vendored and fires on every load, so
  # without this it is a failed request per visit — noise in the console and a
  # retry the browser pays for. A silent 204 is what staging has always
  # answered and it means the same thing here: counted nowhere, on purpose,
  # until the analytics decision is made for this host.
  # ===== THE COUNT IS KEPT, AND ITS HISTORY CAME WITH IT (2026-09-11) =====
  # This read `return 204` for a day — counted nowhere, on purpose, because the
  # droplet's GoatCounter runs on ITS localhost and this box had none. That was
  # a decision about the new host and not a migration: every view Stellate has
  # ever recorded lives in a 757 KB SQLite file, and leaving it behind would
  # have quietly ended the record the day the domain moved.
  # So the service came too — the same binary (v2.7.0), the same `-base-path
  # /stats`, the same database, snapshotted with the service stopped so the
  # copy is consistent rather than a torn read of an open WAL.
  location /gc/count {
    proxy_pass http://127.0.0.1:8081/stats/count;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # the edge terminated it; say so
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache";
  }
  # THE DASHBOARD, behind GoatCounter's own login, never cached.
  location /stats {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
  }
  location /gc/ { return 404; }

  # nginx 1.24's mime.types knows neither .webmanifest nor rss+xml.
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location = /feed.xml          { types {} default_type application/rss+xml;   add_header Cache-Control "no-cache"; }
  location = /feed-archive.xml  { types {} default_type application/rss+xml;   add_header Cache-Control "no-cache"; }
  location = /feed.json         { types {} default_type application/feed+json; add_header Cache-Control "no-cache"; }
  location = /feed-archive.json { types {} default_type application/feed+json; add_header Cache-Control "no-cache"; }
  location = /sitemap.xml       { types {} default_type application/xml;       add_header Cache-Control "no-cache"; }
}
