     the raw markup): production CSP has no 'unsafe-inline'. -->

<body>
<header id="fgbar">
  <h1 class="fg-brand">STELLATE<span class="fg-tag">spec</span></h1>
  <p class="fg-read" id="spRead"></p>
  <div class="fg-controls">
    <button id="spStop" class="fg-btn" title="Stop">■</button>
    <a class="fg-btn" href="fugue.html">fugue</a>
    <a class="fg-btn" href="ca.html">ca</a>
  </div>
</header>

<!-- THE SHEET IS GENERATED. Nothing below the picker is written by hand: the
     sections, their values and every line in them come from engine/explain.js
     reading the resolved state, through tables keyed on engine values. A genre
     nobody has ever looked at gets a correct sheet. -->
<main id="spDoc">
  <section class="fg-step" id="spHead">
    <p class="fg-n" id="spKicker">the spec sheet</p>
    <h2 id="spTitle">—</h2>
    <p id="spSub"></p>
    <!-- SUBMERGE — one knob over four fields that were measured moving together
         (citypop -> vaporwave -> mallsoft). It sits at the top because it is the
         only control here that is a GESTURE rather than a parameter. -->
    <div id="spSubmerge" class="sp-knobs"></div>
    <input id="spFind" class="ca-find" type="search" placeholder="search 274 anchors…" aria-label="Search anchors">
    <div id="spList" class="sp-list" role="listbox" aria-label="Anchors"></div>
  </section>
  <div id="spRows"></div>
  <section class="fg-step">
    <p class="fg-n">all of it</p>
    <h2>The whole state, playing.</h2>
    <div class="fg-effect">
      <div class="fg-row"><button class="fg-play fg-big" data-layer="all">▶ play everything</button>
        <button id="spLink" class="fg-btn">↗ link</button></div>
    </div>
    <p class="fg-note">Generated by <code>engine/explain.js</code> from the resolved state — no prose
      is written per genre. By <a href="mailto:paul.ford@aboard.com?subject=Stellate%20spec">Paul Ford</a> at
      <a href="https://aboard.com">Aboard</a> · <a href="https://github.com/aboard-io/stellate">open source</a> · MIT ·
      <a href="ca.html">ca</a> · <a href="fugue.html">fugue</a> · <a href="index.html">star map</a></p>
  </section>
</main>
